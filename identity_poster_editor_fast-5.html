<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>index</title>
<style>
:root{--gold:#ffd21a;--panel:#151515;--muted:#aaa}
*{box-sizing:border-box}
body{margin:0;background:#090909;color:#f5f5f5;font-family:Arial, sans-serif}
header{padding:20px 16px 12px;max-width:900px;margin:auto}
header h1{font-size:25px;margin:0 0 7px}
header p{margin:0;color:#aaa;font-size:14px;line-height:1.5}
main{max-width:900px;margin:auto;padding:12px 16px 28px;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(260px,.8fr);gap:18px;align-items:start}
.preview{background:#111;border:1px solid #303030;border-radius:16px;padding:10px}
canvas{width:100%;height:auto;display:block;border-radius:8px;background:#000}
.panel{background:var(--panel);border:1px solid #303030;border-radius:16px;padding:18px}
.panel h2{font-size:18px;margin:0 0 18px}
.field{margin:0 0 18px}
label{display:block;font-size:14px;font-weight:700;margin-bottom:9px}
input[type=file]{width:100%;padding:12px;border:1px dashed #555;border-radius:12px;background:#0d0d0d;color:#bbb}
input[type=text]{width:100%;padding:14px;border-radius:10px;border:1px solid #444;background:#090909;color:#fff;font-size:17px}
.hint,.status{font-size:12px;line-height:1.5;color:#999;margin-top:8px}
.actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
button{border:0;border-radius:10px;padding:14px 16px;font-size:14px;font-weight:750;cursor:pointer}
.primary{background:var(--gold);color:#111;flex:1}
.secondary{background:#292929;color:#eee}
@media(max-width:760px){main{grid-template-columns:1fr;padding:10px 14px 26px}header{padding:18px 14px 10px}.panel{padding:16px}}
</style>
</head>
<body>
<header>
  <h1>Identity · Poster editor</h1>
  <p>Upload a portrait and enter the name to personalise the poster.</p>
</header>
<main>
  <section class="preview">
    <canvas id="poster" width="1254" height="1254" aria-label="Poster preview">Poster preview</canvas>
  </section>
  <section class="panel">
    <h2>Personalise the poster</h2>
    <div class="field">
      <label for="photo">Replace the photo</label>
      <input id="photo" type="file" accept="image/*">
      <div class="hint">The photo space starts blank. Upload a portrait to place it in the frame.</div>
    </div>
    <div class="field">
      <label for="name">Name</label>
      <input id="name" type="text" value="" maxlength="32" placeholder="Enter name">
    </div>
    <div class="actions">
      <button class="primary" id="download">Download poster PNG</button>
      <button class="secondary" id="reset">Reset</button>
    </div>
    <div class="status" id="status">Upload a photo and enter a name. The original poster design stays unchanged.</div>
  </section>
</main>

const canvas=document.getElementById('poster');
const ctx=canvas.getContext('2d');
const base=new Image();
base.src=posterData;
let portrait=null;
const $=id=>document.getElementById(id);

function draw(){
  if(!base.complete || !base.naturalWidth) return;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(base,0,0,canvas.width,canvas.height);

  // Insert a new portrait only after the user chooses one.
  if(portrait){
    ctx.save();
    ctx.translate(933,604);
    ctx.rotate(5*Math.PI/180);
    const w=493, h=548;
    const scale=Math.max(w/portrait.width,h/portrait.height);
    const dw=portrait.width*scale, dh=portrait.height*scale;
    ctx.beginPath();
    ctx.rect(-w/2,-h/2,w,h);
    ctx.clip();
    ctx.drawImage(portrait,-dw/2,-dh/2,dw,dh);
    ctx.restore();
  }

  // Editable name on the Polaroid caption.
  ctx.save();
  ctx.translate(900,907);
  ctx.rotate(5*Math.PI/180);
  const label=$('name').value.trim() || 'Name';
  let size=42;
  ctx.font=`800 ${size}px Arial, sans-serif`;
  while(ctx.measureText(label).width>440 && size>18){
    size--;
    ctx.font=`800 ${size}px Arial, sans-serif`;
  }
  ctx.fillStyle='#090909';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText(label,0,0,440);
  ctx.restore();
}

base.onload=draw;
base.onerror=()=>{ $('status').textContent='The poster artwork could not load. Reopen the editor file.'; };
$('photo').addEventListener('change',event=>{
  const file=event.target.files && event.target.files[0];
  if(!file) return;
  if(!file.type.startsWith('image/')){
    $('status').textContent='Please choose an image file.';
    return;
  }
  const url=URL.createObjectURL(file);
  const img=new Image();
  img.onload=()=>{
    portrait=img;
    draw();
    $('status').textContent='Photo added to the poster.';
    URL.revokeObjectURL(url);
  };
  img.onerror=()=>{
    $('status').textContent='Could not read that image. Try another file.';
    URL.revokeObjectURL(url);
  };
  img.src=url;
});
$('name').addEventListener('input',draw);
$('download').addEventListener('click',()=>{
  draw();
  canvas.toBlob(blob=>{
    if(!blob){ $('status').textContent='Export failed. Please try again.'; return; }
    const url=URL.createObjectURL(blob);
    const link=document.createElement('a');
    link.href=url;
    link.download='identity-poster.png';
    link.click();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
    $('status').textContent='Your poster PNG is ready.';
  },'image/png');
});
$('reset').addEventListener('click',()=>{
  $('photo').value='';
  $('name').value='';
  portrait=null;
  $('status').textContent='Photo and name cleared.';
  draw();
});
draw();
</script>
